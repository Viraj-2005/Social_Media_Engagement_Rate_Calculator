{% extends 'base.html' %}

{% block title %}Password Reset Sent - EngageRate{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card animate-in text-center">
            <div class="card-body py-5">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-success/10 text-success mb-4">
                    <i class="bi bi-envelope-check" style="font-size: 2.5rem;"></i>
                </div>
                <h4 class="mb-2">Check Your Email</h4>
                <p class="text-muted mb-4">We've sent password reset instructions to your email address. If you don't see it, check your spam folder.</p>
                <a href="{% url 'analytics:login' %}" class="btn btn-primary btn-icon">
                    <i class="bi bi-box-arrow-in-right"></i> Back to Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
